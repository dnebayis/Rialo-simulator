
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rialo | Coding the Real World</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #e8e3d5;
            font-family: 'Inter', sans-serif;
            color: #141414;
        }

        #root {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- UI Overlays --- */

        /* Logo */
        #logo-container {
            position: absolute;
            top: 32px;
            left: 32px;
            z-index: 10;
            transition: transform 0.3s ease;
        }
        #logo-container:hover {
            transform: scale(1.05);
        }
        #logo-container svg {
            width: 64px;
            height: 64px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
        }

        /* Stage Info / Story Card */
        #stage-info {
            position: absolute;
            bottom: 90px; /* Lowered closer to footer */
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            width: 90%;
            max-width: 420px; /* Reduced width */
            padding: 24px; /* Reduced padding */
            background: rgba(255, 255, 255, 0.65); /* More transparent */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #stage-info h2 {
            margin: 0 0 8px 0;
            font-size: 1.35rem; /* Slightly smaller text */
            font-weight: 600;
            letter-spacing: -0.03em;
            color: #141414;
        }

        #stage-info p {
            margin: 0 0 16px 0;
            font-size: 0.95rem; /* Slightly smaller text */
            line-height: 1.5;
            color: #444;
            font-weight: 400;
        }

        /* Navigation Controls */
        #nav-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin-top: 8px;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid #141414;
            color: #141414;
            width: 40px; /* Smaller buttons */
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            font-size: 1.1rem;
        }

        .nav-btn:hover {
            background: #141414;
            color: #fff;
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            opacity: 0.2;
            cursor: not-allowed;
            background: transparent;
            color: #141414;
            transform: none;
        }

        .dots-container {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(0,0,0,0.2);
            transition: background 0.3s;
        }

        .dot.active {
            background: #141414;
        }

        /* Detail Modal */
        #detail-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            width: 340px;
            padding: 40px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
            z-index: 100;
            opacity: 1;
            transition: opacity 0.3s, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
            text-align: left;
        }

        #detail-modal.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -40%) scale(0.95);
        }

        #close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            transition: color 0.2s;
        }
        
        #close-modal:hover {
            color: #141414;
        }

        #modal-title {
            margin: 0 0 12px 0;
            font-size: 1.25rem;
            font-weight: 600;
            color: #141414;
        }

        #modal-description {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #555;
        }

        /* Tooltip */
        #tooltip {
            position: absolute;
            background: rgba(20, 20, 20, 0.9);
            color: #fff;
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 0.8rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.1s;
            z-index: 30;
            top: 0;
            left: 0;
            white-space: nowrap;
            font-weight: 500;
            transform: translate(-50%, -150%);
            backdrop-filter: blur(4px);
        }

        /* Footer */
        #main-footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 24px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
            z-index: 15;
            background: linear-gradient(to top, rgba(232, 227, 213, 1) 0%, rgba(232, 227, 213, 0) 100%);
            pointer-events: none; /* Let clicks pass through area */
        }

        #main-footer a {
            pointer-events: auto; /* Re-enable clicks on links */
            text-decoration: none;
            color: #141414;
            font-size: 0.85rem;
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.2s;
            font-weight: 500;
        }

        #main-footer a:hover {
            opacity: 1;
            transform: translateY(-2px);
        }

        #main-footer span {
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            #stage-info {
                bottom: 110px;
                width: 85%;
                padding: 20px;
            }
            #main-footer {
                flex-direction: column;
                gap: 12px;
                padding-bottom: 32px;
                background: rgba(232, 227, 213, 0.95);
            }
            #main-footer span {
                display: none;
            }
        }

        .hidden { opacity: 0 !important; pointer-events: none !important; }
    </style>
</head>
<body>

    <!-- Logo -->
    <a href="https://www.rialo.io" target="_blank" id="logo-container">

        </svg>
    </a>

    <!-- 3D Canvas -->
    <div id="root"></div>

    <!-- Tooltip -->
    <div id="tooltip"></div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="hidden">
        <button id="close-modal">&times;</button>
        <h2 id="modal-title">Title</h2>
        <p id="modal-description">Description text goes here.</p>
    </div>

    <!-- Stage Info & Navigation -->
    <div id="stage-info">
        <h2 id="stage-title">Rialo</h2>
        <p id="stage-description">Loading the simulation...</p>
        
        <div id="nav-controls">
            <button class="nav-btn" id="prev-btn" aria-label="Previous Stage">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="dots-container" id="dots-container">
                <!-- Dots injected by JS -->
            </div>
            <button class="nav-btn" id="next-btn" aria-label="Next Stage">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>
    </div>

    <!-- Footer Links -->
    <footer id="main-footer">
        <a href="https://www.rialo.io/posts/introducing-rialo" target="_blank">Introducing Rialo</a>

</body>
</html>
